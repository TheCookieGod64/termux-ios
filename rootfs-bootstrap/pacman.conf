#
# /var/jb/etc/pacman.conf
# Pacman package manager configuration for Termux-iOS (iPhone 8 / palera1n)
#

[options]
# Root & DB paths inside /var/jb chroot
RootDir     = /
DBPath      = /var/lib/pacman/
CacheDir    = /var/cache/pacman/pkg/
LogFile     = /var/log/pacman.log
GPGDir      = /etc/pacman.d/gnupg/
HookDir     = /etc/pacman.d/hooks/
HoldPkg     = pacman glibc termux-ios-core
XferCommand = /usr/bin/curl -L -C - -f -o %o %u
CleanMethod = KeepInstalled
Architecture = aarch64

# Visual & Termux aesthetic options
Color
ILoveCandy
CheckSpace
VerbosePkgLists
ParallelDownloads = 5

# Signature verification
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Termux-iOS Arch ARM Repositories
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[community]
Include = /etc/pacman.d/mirrorlist

[termux-ios]
Server = https://repo.termux-ios.dev/arm64
SigLevel = Never
